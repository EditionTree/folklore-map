  <link rel="icon" type="image/png" href="green-man.png"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment:    #f2e8d5;
      --parchment-dk: #e0d0b0;
      --ink:          #2c1f0e;
      --ink-light:    #5c4a2a;
      --accent:       #8b3a1a;
      --accent-glow:  #c4622a;
      --border:       #b09060;
      --shadow:       rgba(44, 31, 14, 0.25);
      --font-display: 'Cinzel', serif;
      --font-body:    'Crimson Text', serif;

      --map-filter-day:   sepia(0.8) brightness(0.9) contrast(1.1) saturate(0.7);
      --map-filter-night: grayscale(0.6) brightness(0.55) contrast(1.2) sepia(0.3) hue-rotate(200deg);
    }

    html {
      background: #1e1408;
    }
    body {
      background: var(--parchment-dk);
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #1e1408 0%, var(--ink) 75%);
      border-bottom: 1px solid rgba(176,144,96,0.35);
      padding: 18px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: relative;
      z-index: 1000;
    }
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 15%, var(--border) 50%, var(--accent) 85%, transparent 100%);
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(176,144,96,0.6) 20%, rgba(196,98,42,0.8) 50%, rgba(176,144,96,0.6) 80%, transparent 100%);
    }
    .header-emblem {
      width: 72px; height: 72px;
      flex-shrink: 0;
      object-fit: contain;
      filter: sepia(0.9) brightness(0.7) contrast(1.15) saturate(1.3);
      mask-image: radial-gradient(ellipse 70% 70% at center, black 30%, rgba(0,0,0,0.6) 50%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at center, black 30%, rgba(0,0,0,0.6) 50%, transparent 70%);
    }
    @media (max-width: 640px) { .header-emblem { width: 44px; height: 44px; } }
    .header-title { display: flex; align-items: center; gap: 14px; }
    .header-title-row { display: flex; align-items: baseline; gap: 14px; }
    .mobile-title { display: none; }
    h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--parchment);
      letter-spacing: 0.1em;
      text-shadow: 0 1px 22px rgba(196,98,42,0.5), 0 0 50px rgba(176,144,96,0.15);
    }
    h1::before, h1::after {
      content: '✦';
      font-size: 11px;
      color: var(--accent-glow);
      opacity: 0.75;
      vertical-align: middle;
      margin: 0 10px;
    }
    .subtitle {
      font-family: var(--font-body);
      font-size: 13px;
      color: rgba(176,144,96,0.8);
      font-style: italic;
      letter-spacing: 0.05em;
    }
    .header-controls { display: flex; align-items: center; gap: 10px; }

    /* ── DARK MODE TOGGLE ── */
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--border);
      cursor: pointer;
      user-select: none;
    }
    .toggle-track {
      width: 38px; height: 20px;
      background: #3a2c18;
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      transition: background 0.3s;
    }
    .toggle-track.on { background: #1a2840; border-color: #4a6898; }
    .toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: var(--border);
      border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(18px); background: #7090c8; }

    /* ── SEARCH BAR ── */
    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px 5px 30px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--parchment);
      width: 180px;
      outline: none;
    }
    .search-wrap input::placeholder { color: var(--border); }
    .search-wrap input:focus { border-color: var(--accent-glow); background: rgba(255,255,255,0.12); }
    .search-icon {
      position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: var(--border); pointer-events: none;
    }
    .search-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: 4px;
      z-index: 2000;
      display: none;
    }
    .search-results.open { display: block; }
    .search-result-item {
      padding: 7px 12px;
      font-size: 13px;
      color: var(--parchment);
      cursor: pointer;
      border-bottom: 0.5px solid #3a2c18;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: rgba(255,255,255,0.08); }
    .search-result-item span { color: var(--border); font-size: 11px; margin-left: 6px; }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: var(--parchment);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      position: relative;
      z-index: 900;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    @media (max-width: 640px) {
      .filter-bar { padding: 6px 12px; }
    }
    .filter-label {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--ink-light);
      text-transform: uppercase;
      margin-right: 4px;
    }
    .filter-btn {
      font-family: var(--font-body);
      font-size: 13px;
      padding: 3px 12px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn:hover { background: var(--parchment-dk); }
    .filter-btn.active { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
    .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .count-badge {
      font-size: 10px;
      background: var(--parchment-dk);
      border-radius: 99px;
      padding: 1px 5px;
      color: var(--ink-light);
    }
    .filter-btn.active .count-badge { background: rgba(255,255,255,0.2); color: var(--parchment); }

    /* ── MAP CONTAINER ── */
    .map-wrap {
      flex: 1;
      position: relative;
      min-height: 500px;
    }
    #map {
      position: absolute; inset: 0;
    }
    #map .leaflet-tile-pane {
      filter: var(--map-filter-day);
      transition: filter 1.2s ease;
    }
    #map.night .leaflet-tile-pane { filter: var(--map-filter-night); }

    /* Parchment vignette overlay — sits above tiles (200) but below markers (600) */
    .map-vignette {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 399;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(44,31,14,0.22) 100%);
    }
    .map-border {
      position: absolute; inset: 8px;
      pointer-events: none; z-index: 399;
      border: 1px solid rgba(176,144,96,0.3);
    }

    /* ── LEAFLET POPUP OVERRIDES ── */
    .leaflet-popup-content-wrapper {
      background: var(--parchment) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      box-shadow: 0 4px 20px var(--shadow) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip { background: var(--parchment) !important; }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-close-button {
      color: var(--ink-light) !important;
      font-size: 16px !important;
      padding: 6px 8px !important;
    }

    /* ── POPUP CONTENT ── */
    .popup-inner { position: relative; padding: 14px 16px; min-width: 240px; max-width: 300px; }
    .popup-cat {
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 2px;
      color: #fff;
      display: inline-block;
      margin-bottom: 7px;
    }
    .popup-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .popup-region {
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
      margin-bottom: 8px;
    }
    .popup-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
      opacity: 0.5;
    }
    .popup-summary {
      font-size: 13.5px;
      line-height: 1.75;
      color: #4a3820;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    .popup-summary::first-letter {
      font-family: var(--font-display);
      font-size: 2.2em;
      font-weight: 600;
      color: var(--accent);
      vertical-align: bottom;
      line-height: 1;
    }
    .popup-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(176,144,96,0.4); }
    .popup-source {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid rgba(139,58,26,0.35);
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .popup-source:hover { background: var(--accent); color: var(--parchment); }
    .popup-copylink {
      background: none; border: 1px solid rgba(92,74,42,0.25); border-radius: 2px;
      padding: 4px 10px; cursor: pointer;
      font-family: var(--font-display); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light); transition: border-color 0.15s, color 0.15s;
    }
    .popup-copylink:hover { color: var(--accent); border-color: rgba(139,58,26,0.5); }
    .bookmark-btn {
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--ink-light); line-height: 1; transition: color 0.15s, transform 0.15s;
    }
    .bookmark-btn:hover { color: var(--accent); transform: scale(1.08); }
    .bookmark-btn.bookmarked { color: var(--accent); }
    .bookmark-icon { display: block; width: 13px; height: 17px; }
    .filter-icon .bookmark-icon { width: 12px; height: 15px; }
    .popup-bookmark {
      position: absolute; top: -1px; right: 38px;
      width: 24px; height: 34px;
      color: var(--border);
      filter: drop-shadow(0 2px 2px rgba(44,31,14,0.16));
      transform-origin: top center;
    }
    .popup-bookmark:hover { color: var(--accent); transform: translateY(1px); }
    .popup-bookmark .popup-bookmark-tab { display: block; width: 24px; height: 34px; }

    /* ── LEGEND PANEL ── */
    .legend-panel {
      position: absolute;
      bottom: 24px; right: 12px;
      z-index: 650;
      background: rgba(242,232,213,0.96);
      border: 1px solid var(--border);
      border-radius: 4px;
      min-width: 130px;
      overflow: hidden;
    }
    .legend-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px 6px;
      border-bottom: 1px solid rgba(176,144,96,0.3);
      cursor: pointer;
      user-select: none;
    }
    .legend-header:hover { background: rgba(176,144,96,0.1); }
    .legend-title {
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-light);
    }
    .legend-toggle {
      font-size: 14px; color: var(--ink-light); line-height: 1;
      transition: transform 0.2s;
    }
    .legend-body { padding: 8px 14px 10px; }
    .legend-body.collapsed { display: none; }
    .legend-item {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--ink);
      margin-bottom: 5px;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── FOOTER ── */
    footer {
      background: linear-gradient(180deg, var(--ink) 0%, #1e1408 100%);
      border-top: none;
      padding: 8px 20px;
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1000;
      gap: 12px;
    }
    footer::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(176,144,96,0.6) 20%, rgba(196,98,42,0.8) 50%, rgba(176,144,96,0.6) 80%, transparent 100%);
    }
    footer a { color: var(--border); text-decoration: none; }
    footer a:hover { color: var(--parchment); }
    .footer-brand {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(176,144,96,0.7);
      white-space: nowrap;
    }
    .footer-brand span { color: rgba(196,98,42,0.8); margin: 0 6px; }
    .footer-tiles { font-size: 10px; color: rgba(176,144,96,0.5); text-align: right; }
    @media (max-width: 640px) {
      .footer-tiles { display: none; }
    }

    .marker-cluster { border-radius: 50% !important; background: transparent !important; }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: none !important; }
    .marker-cluster div {
      font-family: var(--font-display); font-size: 11px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; width: 100% !important; height: 100% !important;
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .marker-cluster-small div  { background: #1e3a5f; color: #a8d4f0; }
    .marker-cluster-medium div { background: #152c48; color: #c0dff5; }
    .marker-cluster-large div  { background: #0e1e30; color: #d8eeff; }
    .entry-count {
      font-family: var(--font-body); font-size: 11px; color: var(--ink-light);
      font-style: italic; margin-left: auto; padding-right: 2px;
      white-space: nowrap; align-self: center;
    }
    .filter-icon { display: flex; align-items: center; margin-right: 3px; opacity: 0.75; }
    .filter-btn.active .filter-icon { opacity: 1; filter: brightness(10); }
    .legend-dot { display: flex; align-items: center; }

    /* ── LAYOUT ── */
    body { overflow: hidden; height: 100vh; height: 100dvh; }
    .content-area { flex: 1; display: flex; overflow: hidden; position: relative; }
    .map-wrap { flex: 1; position: relative; overflow: hidden; min-height: 0; }
    :root { --sidebar-w: 280px; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--parchment); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: width 0.28s ease, opacity 0.28s ease;
      overflow: hidden; z-index: 800;
    }
    .sidebar.collapsed { width: 0; opacity: 0; pointer-events: none; }
    .sidebar-header { padding: 10px 14px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-title { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 2px; }
    .sidebar-subtitle { font-size: 11px; color: var(--ink-light); font-style: italic; }
    .sidebar-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 0; }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-track { background: var(--parchment-dk); }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar-item { padding: 6px 14px; cursor: pointer; border-bottom: 0.5px solid rgba(176,144,96,0.25); display: flex; align-items: flex-start; gap: 8px; transition: background 0.1s; }
    .sidebar-item:hover { background: var(--parchment-dk); }
    .sidebar-item.active { background: rgba(139,58,26,0.1); }
    .sidebar-item-icon { display: flex; align-items: center; flex-shrink: 0; margin-top: 2px; opacity: 0.75; }
    .sidebar-item-text { min-width: 0; flex: 1; }
    .sidebar-item-name { font-family: var(--font-display); font-size: 11px; color: var(--ink); font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item-region { font-size: 10px; color: var(--ink-light); font-style: italic; }
    .sidebar-bookmark { flex-shrink: 0; font-size: 17px; margin-top: 1px; }
    .sidebar-toggle-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 4px; color: var(--parchment); font-family: var(--font-body); font-size: 12px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
    .sidebar-toggle-btn:hover { background: rgba(255,255,255,0.14); }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      /* Header: title above a full-width control row so iOS never clips controls */
      header {
        padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      header::before { display: none; }
      h1 { font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      h1::before, h1::after { display: none; }
      .desktop-title { display: none; }
      .mobile-title { display: block; }
      .subtitle { display: none; }
      .header-title { width: 100%; min-width: 0; }
      .header-controls {
        width: 100%;
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 7px;
      }
      #modeLabel { display: none; }
      .search-wrap { min-width: 0; }
      .search-wrap input { width: 100%; font-size: 12px; }
      .sidebar-toggle-btn { font-size: 11px; padding: 4px 8px; }
      footer { padding-bottom: calc(5px + env(safe-area-inset-bottom)); }

      /* Filter bar: icon + count only, no text label */

CATEGORIES.pirate.label = "Pirates & Smugglers";

let nightMode = false;
let markers = [];
let activeFilters = new Set();
let bookmarksOnly = false;
const BOOKMARKS_STORAGE_KEY = 'folkloreMapBookmarks';
let bookmarks = loadBookmarks();
const isMobile = () => window.innerWidth <= 640;
let sidebarOpen = isMobile() ? false : (localStorage.getItem('sidebarOpen') !== 'false');

function loadBookmarks() {
  try {
    const stored = JSON.parse(localStorage.getItem(BOOKMARKS_STORAGE_KEY) || '[]');
    return new Set(Array.isArray(stored) ? stored : []);
  } catch {
    return new Set();
  }
}

function saveBookmarks() {
  try {
    localStorage.setItem(BOOKMARKS_STORAGE_KEY, JSON.stringify([...bookmarks]));
  } catch {
    // Bookmarks remain available for the current page if storage is blocked.
  }
}

function isBookmarked(name) {
  return bookmarks.has(name);
}

function bookmarkIconSvg(bookmarked) {
  return `<svg class="bookmark-icon" viewBox="0 0 16 20" aria-hidden="true">
    <path d="M2.5 1.5h11v16l-5.5-3.6-5.5 3.6z"
      fill="${bookmarked ? 'currentColor' : 'none'}"
      stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function popupBookmarkTabSvg(bookmarked) {
  return `<svg class="popup-bookmark-tab" viewBox="0 0 24 34" aria-hidden="true">
    <path d="M1 0.5h22v31l-11-6.8-11 6.8z"
      fill="${bookmarked ? 'var(--accent)' : 'var(--parchment-dk)'}"
      stroke="${bookmarked ? 'var(--accent)' : 'var(--border)'}"
      stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// Apply persisted sidebar state immediately (before data loads)
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('sidebar');
  const btn     = document.getElementById('sidebarToggleBtn');
  if (!sidebarOpen) {
    sidebar.classList.add('collapsed');
    btn.textContent = '☰ Entries';
  }
});

const EXCLUDED_LEGEND_NAMES = new Set([
  'Boulogne-sur-Mer',
  'Byland Abbey',
  'Cambridge University Press',
  'England',
  'English Channel',
]);

const BOUNDS = L.latLngBounds([44.0, -16.0], [67.0, 9.0]);
const map = L.map('map', {
  zoomControl: true, minZoom: 5, maxZoom: 17,
  maxBounds: BOUNDS, maxBoundsViscosity: 0.7,
  attributionControl: false
}).setView([54.5, -2.5], 6);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 55, spiderfyOnMaxZoom: true,
  showCoverageOnHover: false, zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 12,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    const size  = count < 10 ? 'small' : count < 50 ? 'medium' : 'large';
    const dim   = count < 10 ? 36 : count < 50 ? 42 : 50;
    return L.divIcon({
      html: '<div><span>' + count + '</span></div>',
      className: 'marker-cluster marker-cluster-' + size,
      iconSize: L.point(dim, dim)
    });
  }
});

L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}{r}.png?api_key=89e39892-dad3-41e7-89e6-fa69ac42bb85', {
  attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://stamen.com">Stamen Design</a> &copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);

function makeIcon(category, isNight) {
  const cat = CATEGORIES[category] || CATEGORIES.beast;
  const c   = cat.colour;
  // Scale path from 512x512 to fit inside pin (offset+scale via transform)
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 42' width='32' height='42'>
    <path d='M16 1C8.3 1 2 7.3 2 15c0 11 14 26 14 26S30 26 30 15C30 7.3 23.7 1 16 1z'
          fill='${c}' stroke='rgba(255,255,255,0.35)' stroke-width='0.8'/>
    <circle cx='16' cy='15' r='10' fill='rgba(0,0,0,0.15)'/>
    <g transform='translate(5, 4) scale(0.0430)'>
      <path d='${cat.iconPath}' fill='white' opacity='0.92'/>
    </g>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [32, 42], iconAnchor: [16, 42], popupAnchor: [0, -44] });
}

function lightenForNight(hex) {
  return hex;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  })[char]);
}

function safeSourceUrl(value) {
  try {
    const url = new URL(String(value ?? ''), window.location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
  } catch {
    return '#';
  }
}

function buildPopup(leg) {
  const cat = CATEGORIES[leg.category];
  const encoded = encodeURIComponent(leg.name);
  const bookmarked = isBookmarked(leg.name);
  return `<div class="popup-inner">
    <button class="bookmark-btn popup-bookmark${bookmarked ? ' bookmarked' : ''}" data-bookmark="${encoded}" aria-label="${bookmarked ? 'Remove bookmark' : 'Bookmark'}" title="${bookmarked ? 'Remove bookmark' : 'Bookmark'}">${popupBookmarkTabSvg(bookmarked)}</button>
    <span class="popup-cat" style="background:${cat.colour}">${cat.label}</span>
    <div class="popup-title">${escapeHtml(leg.name)}</div>
    <div class="popup-region">${escapeHtml(leg.region)}</div>
    <hr class="popup-divider"/>
    <p class="popup-summary">${escapeHtml(leg.summary)}</p>
    <div class="popup-footer">
      <a class="popup-source" href="${escapeHtml(safeSourceUrl(leg.source))}" target="_blank" rel="noopener">Read more</a>
      <button class="popup-copylink" data-legend="${encoded}">copy link</button>
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const bookmarkBtn = e.target.closest('[data-bookmark]');
  if (bookmarkBtn) {
    e.preventDefault();
    e.stopPropagation();
    toggleBookmark(decodeURIComponent(bookmarkBtn.dataset.bookmark));
    return;
  }
  const btn = e.target.closest('.popup-copylink');
  if (!btn) return;
  const url = new URL(location.href);
  url.search = '?legend=' + btn.dataset.legend;
  navigator.clipboard.writeText(url.toString()).then(() => {
    btn.textContent = 'copied';
    setTimeout(() => { btn.textContent = 'copy link'; }, 2000);
  });
});

function toggleBookmark(name) {
  if (bookmarks.has(name)) bookmarks.delete(name);
  else bookmarks.add(name);
  saveBookmarks();
  markers.forEach(marker => marker.setPopupContent(buildPopup(marker._legendData)));
  buildFilters();
  filterMarkers();
}

let LEGENDS = [];

function loadMarkers(legends) {
  legends.forEach(leg => {
    if (!CATEGORIES[leg.category]) leg.category = 'beast';
    const marker = L.marker([leg.lat, leg.lng], {
      icon: makeIcon(leg.category, false)
    }).bindPopup(buildPopup(leg), { maxWidth: 300 });
    marker._legendData = leg;
    markers.push(marker);
  });
  clusterGroup.addLayers(markers);
  map.addLayer(clusterGroup);
}

function updateCount(n) {
  const el = document.getElementById('entryCount');
  if (!el) return;
  el.textContent = n === LEGENDS.length ? n + ' entries' : n + ' of ' + LEGENDS.length + ' entries';
}

function buildFilters() {
  const bar = document.getElementById('filterBar');
  const label = bar.querySelector('.filter-label');
  bar.innerHTML = '';
  bar.appendChild(label);

  const allBtn = makeFilterBtn('all', 'All', null);
  bar.appendChild(allBtn);

  bar.appendChild(makeFilterBtn('bookmarks', 'Saved', null, bookmarks.size));

  const usedCats = [...new Set(LEGENDS.map(l => l.category))];
  usedCats.forEach(cat => {
    const count = LEGENDS.filter(l => l.category === cat).length;
    bar.appendChild(makeFilterBtn(cat, CATEGORIES[cat].label, CATEGORIES[cat].colour, count));
  });
}

function makeFilterBtn(cat, label, colour, count) {
  const btn = document.createElement('button');
  btn.className   = 'filter-btn';
  btn.dataset.cat = cat;
  const cat_obj = CATEGORIES[cat];
  let iconHtml = cat === 'bookmarks' ? '<span class="filter-icon">' + bookmarkIconSvg(true) + '</span>' : '';
  if (cat_obj && cat_obj.iconPath) {
    iconHtml = '<span class="filter-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="16" height="16" style="display:block"><path d="' + cat_obj.iconPath + '" fill="currentColor"/></svg></span>';
  }
  const cntHtml = count !== undefined ? '<span class="count-badge">' + count + '</span>' : '';
  btn.innerHTML  = iconHtml + '<span class="btn-label">' + label + '</span>' + (cntHtml ? ' ' + cntHtml : '');
  btn.classList.toggle('active',
    cat === 'all' ? !bookmarksOnly && activeFilters.size === 0 :
    cat === 'bookmarks' ? bookmarksOnly :
    activeFilters.has(cat)
  );
  btn.setAttribute('aria-label', label);
  btn.onclick    = () => filterMarkers(cat);
  return btn;
}

function filterMarkers(cat) {
  if (cat === 'all') {
    activeFilters.clear();
    bookmarksOnly = false;
  } else if (cat === 'bookmarks') {
    bookmarksOnly = !bookmarksOnly;
  } else if (cat) {
    if (activeFilters.has(cat)) activeFilters.delete(cat);
    else activeFilters.add(cat);
  }
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active',
      b.dataset.cat === 'all' ? !bookmarksOnly && activeFilters.size === 0 :
      b.dataset.cat === 'bookmarks' ? bookmarksOnly :
      activeFilters.has(b.dataset.cat)
    );
  });
  clusterGroup.clearLayers();
  const visible = markers.filter(m => {
    const matchesCategory = activeFilters.size === 0 || activeFilters.has(m._legendData.category);
    const matchesBookmark = !bookmarksOnly || isBookmarked(m._legendData.name);
    return matchesCategory && matchesBookmark;
  });
  clusterGroup.addLayers(visible);
  updateCount(visible.length);
  buildSidebarList(visible.map(m => m._legendData));
}

function buildLegend() {
  const panel    = document.getElementById('legendPanel');
  const usedCats = [...new Set(LEGENDS.map(l => l.category))].sort();
  const collapsed = localStorage.getItem('legendCollapsed') === 'true';
  const items = usedCats.filter(c => CATEGORIES[c]).map(cat => {
    const ico = CATEGORIES[cat].iconPath
      ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" style="display:block;flex-shrink:0"><path d="' + CATEGORIES[cat].iconPath + '" fill="' + CATEGORIES[cat].colour + '"/></svg>'
      : '';
    return '<div class="legend-item"><span class="legend-dot" style="display:flex;align-items:center">' + ico + '</span>' + CATEGORIES[cat].label + '</div>';
  }).join('');
  panel.innerHTML =
    '<div class="legend-header" onclick="toggleLegend()">' +
      '<div class="legend-title">Legend</div>' +
      '<span class="legend-toggle" id="legendToggle">' + (collapsed ? '+' : '−') + '</span>' +
    '</div>' +
    '<div class="legend-body' + (collapsed ? ' collapsed' : '') + '" id="legendBody">' + items + '</div>';
}

function toggleLegend() {
  const body = document.getElementById('legendBody');
  const btn  = document.getElementById('legendToggle');
  const nowCollapsed = !body.classList.toggle('collapsed');
  btn.textContent = body.classList.contains('collapsed') ? '+' : '−';
  localStorage.setItem('legendCollapsed', body.classList.contains('collapsed'));
}

function toggleNight() {
  nightMode = !nightMode;
  document.getElementById('map').classList.toggle('night', nightMode);
  document.getElementById('modeTrack').classList.toggle('on', nightMode);
  document.getElementById('modeLabel').textContent = nightMode ? 'Night' : 'Day';
  markers.forEach(m => {
    m.setIcon(makeIcon(m._legendData.category, nightMode));
  });
  if (typeof clusterGroup !== 'undefined') clusterGroup.refreshClusters();
}

function handleSearch(query) {
  const box = document.getElementById('searchResults');
  if (!query.trim()) { box.classList.remove('open'); return; }
  const q = query.toLowerCase();
  const matches = LEGENDS.filter(l =>
    l.name.toLowerCase().includes(q) ||
    l.region.toLowerCase().includes(q) ||
    l.category.toLowerCase().includes(q)
  ).slice(0, 6);
  if (!matches.length) { box.classList.remove('open'); return; }
  box.replaceChildren();
  matches.forEach(leg => {
    const item = document.createElement('div');
    const region = document.createElement('span');
    item.className = 'search-result-item';
    item.textContent = leg.name;
    item.onclick = () => focusLegend(leg.name);
    region.textContent = leg.region;
    item.appendChild(region);
    box.appendChild(item);
  });
  box.classList.add('open');
}

function focusLegend(name) {
  document.getElementById('searchResults').classList.remove('open');
  document.getElementById('searchInput').value = '';
  const leg = LEGENDS.find(l => l.name === name);
  if (!leg) return;
  if ((activeFilters.size && !activeFilters.has(leg.category)) || (bookmarksOnly && !isBookmarked(name))) {
    filterMarkers('all');
  }
  const marker = markers.find(m => m._legendData.name === name);
  if (!marker) return;
  highlightSidebarItem(name);
  if (isMobile() && sidebarOpen) toggleSidebar();
  map.setView([leg.lat, leg.lng], 12, { animate: true });
  setTimeout(() => clusterGroup.zoomToShowLayer(marker, () => marker.openPopup()), 400);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('searchResults').classList.remove('open');
  }
});


function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  document.getElementById('sidebarToggleBtn').textContent = sidebarOpen ? '✕ Entries' : '☰ Entries';
  if (!isMobile()) localStorage.setItem('sidebarOpen', sidebarOpen);
  setTimeout(() => map.invalidateSize(), 300);
}

function buildSidebarList(legends) {
  const list = document.getElementById('sidebarList');
  const sub  = document.getElementById('sidebarSubtitle');
  const sorted = [...legends].sort((a, b) => a.name.localeCompare(b.name));
  const filterLabels = [...activeFilters].map(cat => CATEGORIES[cat]?.label).filter(Boolean);
  const suffix = bookmarksOnly
    ? (filterLabels.length ? ' saved ' + filterLabels.join(' + ') : ' saved entries')
    : (filterLabels.length ? ' ' + filterLabels.join(' + ') : ' entries');
  sub.textContent = sorted.length + suffix;
  list.replaceChildren();
  sorted.forEach(leg => {
    const cat = CATEGORIES[leg.category] || CATEGORIES.beast;
    const item = document.createElement('div');
    const icon = document.createElement('span');
    const text = document.createElement('div');
    const name = document.createElement('div');
    const region = document.createElement('div');
    const bookmark = document.createElement('button');
    item.className = 'sidebar-item';
    item.onclick = () => focusLegend(leg.name);
    icon.className = 'sidebar-item-icon';
    if (cat.iconPath) {
      icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14"><path d="' + cat.iconPath + '" fill="' + cat.colour + '"/></svg>';
    }
    name.className = 'sidebar-item-name';
    name.textContent = leg.name;
    region.className = 'sidebar-item-region';
    region.textContent = leg.region;
    text.className = 'sidebar-item-text';
    bookmark.className = 'bookmark-btn sidebar-bookmark' + (isBookmarked(leg.name) ? ' bookmarked' : '');
    bookmark.dataset.bookmark = encodeURIComponent(leg.name);
    bookmark.setAttribute('aria-label', isBookmarked(leg.name) ? 'Remove bookmark' : 'Bookmark');
    bookmark.title = isBookmarked(leg.name) ? 'Remove bookmark' : 'Bookmark';
    bookmark.innerHTML = bookmarkIconSvg(isBookmarked(leg.name));
    text.append(name, region);
    item.append(icon, text, bookmark);
    list.appendChild(item);
  });
}

function highlightSidebarItem(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => {
    const isActive = el.querySelector('.sidebar-item-name')?.textContent === name;
    el.classList.toggle('active', isActive);
    if (isActive) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function onDataLoaded(legends) {
  LEGENDS = legends.filter(leg => !EXCLUDED_LEGEND_NAMES.has(leg.name));
  const availableNames = new Set(LEGENDS.map(leg => leg.name));
  bookmarks = new Set([...bookmarks].filter(name => availableNames.has(name)));
  saveBookmarks();
  loadMarkers(LEGENDS);
  buildFilters();
  buildLegend();
  buildSidebarList(LEGENDS);
  updateCount(LEGENDS.length);
  markers.forEach(m => m.on('popupopen', () => {
    highlightSidebarItem(m._legendData.name);
    history.replaceState(null, '', '?legend=' + encodeURIComponent(m._legendData.name));
  }));
  clusterGroup.on('popupclose', () => {
    history.replaceState(null, '', location.pathname);
  });

  const deepLink = new URLSearchParams(location.search).get('legend');
  if (deepLink) setTimeout(() => focusLegend(deepLink), 100);
}

function onDataError(err) {
  console.error('Failed to load legend data:', err);
  document.getElementById('filterBar').insertAdjacentHTML('beforeend',
    `<span style="color:#8b3a1a;font-size:12px;margin-left:8px">
      ⚠ Could not load legend data. Check the console for details.
    </span>`
  );
}

function loadLocalLegends() {
  return fetch('legends.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => data.legends || data);
}

if (SUPABASE_URL && SUPABASE_ANON_KEY) {
  // ── Fetch from Supabase ──────────────────────────────────────────────
  // Selects all columns, ordered by name, no row limit
  fetch(`${SUPABASE_URL}/rest/v1/legends?select=*&order=name.asc&limit=10000`, {
    headers: {
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    }
  })
  .then(r => { if (!r.ok) throw new Error(`Supabase HTTP ${r.status}`); return r.json(); })
  .then(onDataLoaded)
  .catch(err => {
    console.warn('Supabase unavailable, using local legend backup:', err);
    return loadLocalLegends().then(onDataLoaded).catch(onDataError);
  });

} else {
  // ── Fallback: fetch from legends.json ────────────────────────────────
  loadLocalLegends().then(onDataLoaded).catch(onDataError);
}

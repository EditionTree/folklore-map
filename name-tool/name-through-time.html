<title>A Name Through Time — prototype</title>

<!--
  STANDALONE PROTOTYPE. Runs entirely from names.json — no Supabase, no network,
  no paid services. This is the "prove the concept" build described in the plan.
  To connect into Folklore Finder later:
    - replace loadNames() with the anon Supabase REST read (see map.html)
    - move MAPS.* into the script_mappings table
    - POST logSearch() to the submit-name-search edge function
  Fonts: Runic/Ogham glyphs render only if a covering font is present. See
  fonts/ note at the bottom — Noto Sans Runic / Ogham (SIL OFL) get self-hosted
  in the real build. Until then the page degrades to a "font needed" hint.
-->

<style>
  :root {
    --ink: #2b2117;
    --ink-soft: #6b5d49;
    --parch: #f4ecdc;
    --parch-2: #efe4cf;
    --edge: #d9c9a8;
    --accent: #7a4a1e;
    --accent-2: #9c6b2f;

    --warn: #9a6a1a;
    --card-shadow: 0 10px 30px rgba(60,40,15,.18);
    --serif: "Marcellus", Georgia, "Times New Roman", serif;
    --body: "Spectral", Georgia, serif;
    --rune: "Noto Sans Runic", "Segoe UI Historic", "BabelStone Runic", var(--serif);
    --ogham: "Noto Sans Ogham", "Segoe UI Historic", "BabelStone Ogham", var(--serif);

  @font-face { font-family: 'Noto Sans Runic'; src: url('fonts/NotoSansRunic.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Noto Sans Ogham'; src: url('fonts/NotoSansOgham.woff2') format('woff2'); font-display: swap; }

  body {
    margin: 0; padding: 2rem 1rem 4rem;

      radial-gradient(120% 90% at 50% -10%, #fbf5e8 0%, var(--parch) 55%, var(--parch-2) 100%);

  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-weight: 400; letter-spacing: .04em;
       text-align: center; font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 0 0 .2rem; }
  .subtitle { text-align: center; color: var(--ink-soft); font-style: italic;
              margin: 0 0 1.8rem; letter-spacing: .02em; }

  form { display: flex; gap: .6rem; margin: 0 auto 1.6rem; max-width: 460px; }
  input[type=text] {
    flex: 1; font-family: var(--serif); font-size: 1.2rem; padding: .7rem .9rem;
    border: 1px solid var(--edge); border-radius: 10px; background: #fffdf7;
    color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent-2); border-color: var(--accent-2); }
  button {
    font-family: var(--serif); font-size: 1rem; padding: .7rem 1.1rem; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent); color: #fdf6e8; letter-spacing: .03em;
  }
  button.ghost { background: #fffaf0; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  /* ── Result card ── */
  .card {
    background: linear-gradient(180deg, #fffdf7, #f7efdd);
    border: 1px solid var(--edge); border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 1.6rem 1.6rem 1.4rem; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 6px; border: 1px solid rgba(160,120,60,.22);
    border-radius: 11px; pointer-events: none;
  }
  .entered { color: var(--ink-soft); font-size: .95rem; letter-spacing: .06em;
             text-transform: uppercase; }
  .canonical { font-family: var(--serif); font-size: 2.1rem; margin: .1rem 0 .1rem; }
  .origin { color: var(--accent); font-style: italic; margin: 0 0 1rem; }
  .meaning { font-size: 1.15rem; margin: 0 0 1.2rem; }
  .meaning::before { content: "“"; color: var(--accent-2); }
  .meaning::after  { content: "”"; color: var(--accent-2); }

  .row { border-top: 1px dashed var(--edge); padding: .9rem 0 .2rem; }
  .row:last-of-type { border-bottom: 1px dashed var(--edge); margin-bottom: 1rem; }
  .row .label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
                color: var(--ink-soft); display: flex; align-items: center; gap: .5rem; }
  .glyphs { font-size: 2rem; line-height: 1.3; margin: .25rem 0 .1rem; word-break: break-word; }
  .glyphs.rune { font-family: var(--rune); }
  .glyphs.ogham { font-family: var(--ogham); }

  .tag { font-size: .68rem; letter-spacing: .05em; text-transform: uppercase;

  .tag.attested      { color: var(--good); border-color: var(--good);  background: rgba(63,111,71,.08); }
  .tag.reconstructed { color: var(--warn); border-color: var(--warn);  background: rgba(154,106,26,.08); }
  .tag.approximate   { color: var(--accent);border-color: var(--accent);background: rgba(122,74,30,.08); }
  .tag.reviewed      { color: var(--ink-soft); border-color: var(--ink-soft); }

  .oe { font-family: var(--serif); font-size: 1.3rem; }
  .oe.none { font-style: italic; color: var(--ink-soft); font-size: 1rem; }
  .note { font-size: .85rem; color: var(--ink-soft); margin: .2rem 0 0; }

  .disclaimer { font-size: .82rem; color: var(--ink-soft); font-style: italic;
                margin: 1rem 0 0; text-align: center; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.2rem; }

  /* ── Pronunciation correction ── */
  .pron { margin: 1rem 0 0; font-size: .9rem; }
  .pron .choices { display: inline-flex; gap: .4rem; flex-wrap: wrap; margin-left: .3rem; }
  .pron button { padding: .25rem .6rem; font-size: .85rem; }
  .pron input { font-size: .9rem; padding: .3rem .5rem; border: 1px solid var(--edge);
                border-radius: 8px; width: 8.5rem; }

  /* ── Loading skeleton ── */
  .skeleton .sk { background: linear-gradient(90deg, #efe4cf 25%, #f7efdd 50%, #efe4cf 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-line { height: 1rem; margin: .6rem 0; }

  /* ── Not-found ── */

  /* ── Card-generation spinner overlay ── */
  .genning { position: absolute; inset: 0; background: rgba(247,239,221,.75);
    display: flex; align-items: center; justify-content: center; font-family: var(--serif);
    letter-spacing: .04em; color: var(--accent); }
  .spinner { width: 1.1rem; height: 1.1rem; border: 2px solid var(--accent);
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
    display: inline-block; margin-right: .6rem; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fonthint { display: none; font-size: .8rem; color: var(--warn); text-align: center; margin-top: .6rem; }
  body.needs-font .fonthint { display: block; }

  /* ── Share panel: style chips + live poster preview ── */
  .sharepanel { margin-top: 1.2rem; border-top: 1px dashed var(--edge); padding-top: 1rem; }
  .tpl-label { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase;
               color: var(--ink-soft); text-align: center; margin-bottom: .55rem; }
  .tpl-chips { display: flex; gap: .45rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .tpl { padding: .4rem .85rem; font-size: .85rem; background: #fffaf0; color: var(--accent);
         border: 1px solid var(--edge); border-radius: 999px; }
  .tpl.active { background: var(--accent); color: #fdf6e8; border-color: var(--accent); }
  .preview-wrap { display: flex; justify-content: center; }
  canvas.preview { width: 100%; max-width: 300px; height: auto; border-radius: 12px;
                   box-shadow: var(--card-shadow); background: #e9dcc2; }
</style>

<div class="wrap">
  <h1>A Name Through Time</h1>
  <p class="subtitle">a polished, honestly-labelled name card</p>

  <form id="lookup">
    <input type="text" id="nameInput" placeholder="Enter a first name…" autocomplete="off" autofocus>
    <button type="submit">Reveal</button>
  </form>

  <div id="result" aria-live="polite"></div>
  <p class="fonthint">Runic/Ogham glyphs may show as boxes until the historical fonts are installed — the real build self-hosts them.</p>
</div>

<script>
/* ============================================================
   1. DATA
   ============================================================ */
let NAMES = [];
async function loadNames() {
  const res = await fetch('names.json');
  const data = await res.json();
  NAMES = data.names;
}

function normalise(s) {
  return (s || '').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, ''); // strip accents for matching
}

function findName(raw) {
  const q = normalise(raw);
  if (!q) return null;
  return NAMES.find(n =>
    n.variants.map(normalise).includes(q) || normalise(n.canonical_name) === q
  ) || null;
}

/* ============================================================
   2. TRANSLITERATION ENGINE (two-stage)
   Stage 1: text/phonemes -> sound tokens (digraph-aware)
   Stage 2: sound token   -> script glyph (per script_system)
   These maps live in code for the prototype; in the real build
   they move to the script_mappings table (editable without deploy).
   ============================================================ */
const DIGRAPHS = ['sh','ch','th','ph','ng','ck','qu','wh','aw','ee','oo','ea','ou'];

// Stage 1 — greedy longest-match tokenizer over graphemes.
function toSoundTokens(text) {
  const s = normalise(text).replace(/[^a-z]/g, '');
  const out = [];
  for (let i = 0; i < s.length; ) {
    const two = s.slice(i, i + 2);
    if (DIGRAPHS.includes(two)) { out.push(two); i += 2; continue; }
    out.push(s[i]); i += 1;
  }
  return out;
}

// Younger Futhark (reproduces the plan's Greg -> ᚴᚱᛁᚴ example).
const YOUNGER_FUTHARK = {
  f:'ᚠ', v:'ᚠ', ph:'ᚠ',
  u:'ᚢ', w:'ᚢ', o:'ᚢ', wh:'ᚢ', oo:'ᚢ', ou:'ᚢ',
  th:'ᚦ',
  r:'ᚱ',
  k:'ᚴ', g:'ᚴ', c:'ᚴ', q:'ᚴ', qu:'ᚴᚢ', ck:'ᚴ', ch:'ᚴ',
  h:'ᚼ', wh_h:'ᚼ',
  n:'ᚾ',
  i:'ᛁ', e:'ᛁ', y:'ᛁ', j:'ᛁ', ee:'ᛁ', ea:'ᛁ',
  a:'ᛅ', aw:'ᛅ',
  s:'ᛋ', sh:'ᛋ', z:'ᛋ',
  t:'ᛏ', d:'ᛏ',
  b:'ᛒ', p:'ᛒ',
  m:'ᛘ',
  l:'ᛚ',
  ng:'ᚾᚴ',
  x:'ᚴᛋ'
};

// Ogham (reproduces the plan's Greg -> ᚌᚏᚓᚌ example).
const OGHAM = {
  b:'ᚁ', l:'ᚂ', f:'ᚃ', v:'ᚃ', w:'ᚃ', ph:'ᚃ',
  s:'ᚄ', sh:'ᚄ', z:'ᚄ',
  n:'ᚅ',
  h:'ᚆ', wh:'ᚆ',
  d:'ᚇ', th:'ᚇ',
  t:'ᚈ',
  c:'ᚉ', k:'ᚉ', ck:'ᚉ', ch:'ᚉ',
  q:'ᚊ', qu:'ᚊ',
  m:'ᚋ',
  g:'ᚌ',
  ng:'ᚍ',
  r:'ᚏ',
  a:'ᚐ', aw:'ᚐ',
  o:'ᚑ', oo:'ᚑ', ou:'ᚑ',
  u:'ᚒ',
  e:'ᚓ', ee:'ᚓ', ea:'ᚓ',
  i:'ᚔ', y:'ᚔ', j:'ᚔ',
  p:'ᚚ', x:'ᚉᚄ'
};

const SCRIPTS = {
  'younger-futhark': { name: 'Younger Futhark', cls: 'rune',  map: YOUNGER_FUTHARK,
    disclaimer: 'Approximate rendering of modern pronunciation — Younger Futhark collapses many sounds onto one rune.' },
  'ogham':          { name: 'Ogham', cls: 'ogham', map: OGHAM,
    disclaimer: 'Approximate rendering of modern pronunciation, not an attested inscription.' }
};

// Stage 2 — map sound tokens to a script.
function transliterate(tokens, scriptKey) {
  const { map } = SCRIPTS[scriptKey];
  return tokens.map(t => map[t] ?? map[t[0]] ?? '·').join('');
}

/* ============================================================
   3. RENDER
   ============================================================ */
const resultEl = document.getElementById('result');
let currentName = null;      // matched record (or null)
let currentTokens = null;    // active sound tokens (may be user-corrected)
let currentEntered = '';

function skeleton() {
  resultEl.innerHTML = `
    <div class="card skeleton">
      <div class="sk sk-line" style="width:30%"></div>
      <div class="sk sk-title"></div>
      <div class="sk sk-line" style="width:45%"></div>
      <div class="sk sk-line" style="width:70%"></div>
      <div class="sk sk-glyph"></div>
      <div class="sk sk-glyph"></div>
    </div>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderKnown(n, entered, tokens) {
  const oe = (n.historical_forms || []).find(f => f.language === 'Old English');
  const oeHtml = oe && oe.historical_form
    ? `<div class="oe">${esc(oe.historical_form)}</div>
       <span class="tag ${esc(oe.status)}">${esc(oe.status)}</span>
       <p class="note">${esc(oe.explanation || '')}</p>`
    : `<div class="oe none">none documented</div>
       <span class="tag reviewed">reviewed</span>
       <p class="note">${esc((oe && oe.explanation) || 'No attested Old English equivalent.')}</p>`;

  const scriptRow = (key) => {
    const S = SCRIPTS[key];
    const glyphs = transliterate(tokens, key);
    return `<div class="row">
      <div class="label">${esc(S.name)} <span class="tag approximate">approximate</span></div>
      <div class="glyphs ${S.cls}">${esc(glyphs)}</div>
      <p class="note">${esc(S.disclaimer)}</p>
    </div>`;
  };

  const pron = n.pronunciation_uk ? `
    <div class="pron">Pronounced <strong>${esc(n.pronunciation_uk)}</strong>?
      <span class="choices">
        <button class="ghost" data-repron="1">Not right — respell it</button>
      </span>
      <span id="repronBox" hidden>
        <input id="repronInput" placeholder="e.g. shuh-vawn">
        <button data-repronapply="1">Apply</button>
      </span>
    </div>` : '';

  resultEl.innerHTML = `
    <div class="card" id="cardEl">
      <div class="entered">You entered — ${esc(entered)}</div>
      <div class="canonical">${esc(n.canonical_name)}</div>
      <div class="origin">from ${esc(n.origin_language)}${n.historical_root ? ' · ' + esc(n.historical_root) : ''}</div>
      <div class="meaning">${esc(n.meaning_summary)}</div>

      <div class="row">
        <div class="label">Old English equivalent</div>
        ${oeHtml}
      </div>
      ${scriptRow('younger-futhark')}
      ${scriptRow('ogham')}

      ${n.historical_notes ? `<p class="note">${esc(n.historical_notes)}</p>` : ''}
      ${pron}
      <p class="disclaimer">These inscriptions approximate the modern English pronunciation rather than representing historically attested spellings.</p>
      ${sharePanel()}
    </div>`;

  wireCardButtons();
  checkFontSupport();
}

function renderUnknown(entered, tokens) {
  resultEl.innerHTML = `
    <div class="card unknown" id="cardEl">
      <div class="entered">You entered — ${esc(entered)}</div>
      <div class="canonical">${esc(entered)}</div>
      <p class="note">No researched record yet — so no origin or meaning is claimed.
         Here is a <em>phonetic approximation only</em>, and this search has been noted for future research.</p>

      <div class="row">
        <div class="label">Younger Futhark <span class="tag approximate">approximate</span></div>
        <div class="glyphs rune">${esc(transliterate(tokens, 'younger-futhark'))}</div>
      </div>
      <div class="row">
        <div class="label">Ogham <span class="tag approximate">approximate</span></div>
        <div class="glyphs ogham">${esc(transliterate(tokens, 'ogham'))}</div>
      </div>

      <p class="disclaimer">A pronunciation approximation, not an authentic historical name.</p>
      ${sharePanel()}
    </div>`;
  wireCardButtons();
  checkFontSupport();
}

/* ============================================================
   4. LOOKUP FLOW (with loading state)
   ============================================================ */
async function doLookup(raw) {
  const entered = raw.trim();
  if (!entered) return;
  currentEntered = entered;

  const started = performance.now();
  let showedSkeleton = false;
  const skTimer = setTimeout(() => { skeleton(); showedSkeleton = true; }, 150);

  await document.fonts.ready.catch(() => {});
  const n = findName(entered);
  currentName = n;
  currentTokens = n && n.phonemes_uk ? n.phonemes_uk.slice() : toSoundTokens(entered);

  // Min-visible guard so the skeleton doesn't flash.
  clearTimeout(skTimer);
  if (showedSkeleton) {
    const elapsed = performance.now() - started;
    if (elapsed < 300) await new Promise(r => setTimeout(r, 300 - elapsed));
  }

  if (n) renderKnown(n, entered, currentTokens);
  else   renderUnknown(entered, currentTokens);

  logSearch(entered, n);
}

/* ============================================================
   5. PRONUNCIATION CORRECTION
   ============================================================ */
function wireRepron() {
  const box = document.getElementById('repronBox');
  document.querySelectorAll('[data-repron]').forEach(b =>
    b.onclick = () => { if (box) box.hidden = false; document.getElementById('repronInput')?.focus(); });
  document.querySelectorAll('[data-repronapply]').forEach(b =>
    b.onclick = () => {
      const val = document.getElementById('repronInput')?.value || '';
      if (!val.trim()) return;
      currentTokens = toSoundTokens(val);
      renderKnown(currentName, currentEntered, currentTokens);
    });
}

/* ============================================================
   6. CARD ACTIONS — copy / share / download (Canvas -> WebP)
   ============================================================ */
function resultText() {
  const n = currentName;
  const yf = transliterate(currentTokens, 'younger-futhark');
  const og = transliterate(currentTokens, 'ogham');
  if (!n) return `${currentEntered}\nYounger Futhark (approx): ${yf}\nOgham (approx): ${og}\n— A Name Through Time`;
  const oe = (n.historical_forms||[]).find(f=>f.language==='Old English');
  return [
    currentEntered,
    `Canonical form: ${n.canonical_name}`,
    `Origin: ${n.origin_language}`,
    `Meaning: ${n.meaning_summary}`,
    `Old English: ${oe && oe.historical_form ? oe.historical_form : 'none documented'}`,
    `Younger Futhark (approx): ${yf}`,
    `Ogham (approx): ${og}`,
    'These are approximations of modern pronunciation, not attested spellings.'
  ].join('\n');
}

function wireCardButtons() {
  wireRepron();
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(resultText()); b.textContent = 'Copied ✓';
      setTimeout(()=>b.textContent='Copy result', 1500); } catch { alert(resultText()); }
  });
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => {
    const shareData = { title: 'A Name Through Time', text: resultText() };
    if (navigator.share) { try { await navigator.share(shareData); } catch {} }
    else { try { await navigator.clipboard.writeText(resultText()); b.textContent='Copied link text ✓';
      setTimeout(()=>b.textContent='Share',1500);} catch {} }
  });
  document.querySelectorAll('[data-download]').forEach(b => b.onclick = () => downloadCard(b));
  wireSharePanel();
}

// Style-chip selection + live preview render.
function wireSharePanel() {
  document.querySelectorAll('.tpl').forEach(b => b.onclick = () => {
    currentTemplate = b.dataset.tpl;
    document.querySelectorAll('.tpl').forEach(x => x.classList.toggle('active', x === b));
    renderPreview();
  });
  renderPreview();
}

async function downloadCard(btn) {
  const card = document.getElementById('cardEl');
  const overlay = document.createElement('div');
  overlay.className = 'genning';
  overlay.innerHTML = '<span class="spinner"></span>engraving your card…';
  card.appendChild(overlay);
  btn.disabled = true;

  try {
    await document.fonts.ready.catch(()=>{});
    // Explicitly ensure the historical faces are loaded before drawing.
    await Promise.all([
      document.fonts.load('48px "Noto Sans Runic"'),
      document.fonts.load('48px "Noto Sans Ogham"'),
    ]).catch(()=>{});

    const blob = await renderShareCardBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (currentName ? currentName.slug : normalise(currentEntered) || 'name') + '-through-time.webp';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  } finally {
    overlay.remove();
    btn.disabled = false;
  }
}

// ── Poster templates: parchment (vector) or a Folklore Finder hero image ──
// Hero art is used with a right-biased crop (subject stays on the right) and a
// left-hand scrim, so the left-aligned text stays legible. Same-origin images
// don't taint the canvas, so WebP export still works.
const CARD_TEMPLATES = {
  'parchment':   { label: 'Parchment',   image: null },
  // alignX frames the subject horizontally in the portrait cover-crop
  // (0 = show left edge, 1 = show right edge). `align` puts the text on the
  // opposite side from the subject so it never sits over the focal point.
  'dragon':      { label: 'Dragon',      image: '/legend-images/stoor-worm-hero.jpg',      alignX: 0.82, align: 'left'  },
  'deity':       { label: 'Deity',       image: '/legend-images/woden-hero.jpg',           alignX: 0.42, align: 'right' },
  'sacred-site': { label: 'Sacred site', image: '/legend-images/glastonbury-tor-hero.jpg', alignX: 0.70, align: 'left'  },
};
const LOGO_SRC = '/green-man.png';
let currentTemplate = 'parchment';

const _imgCache = {};
function loadImg(src) {
  if (!src) return Promise.resolve(null);
  if (!_imgCache[src]) _imgCache[src] = new Promise(res => {
    const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
  });
  return _imgCache[src];
}

// The share panel: style chips + a live preview + the copy/share/download row.
function sharePanel() {
  const chips = Object.entries(CARD_TEMPLATES).map(([k, t]) =>
    `<button class="tpl${k===currentTemplate?' active':''}" data-tpl="${k}">${esc(t.label)}</button>`).join('');
  return `
    <div class="sharepanel">
      <div class="tpl-label">Choose a poster style</div>
      <div class="tpl-chips">${chips}</div>
      <div class="preview-wrap"><canvas id="previewCanvas" class="preview" width="1080" height="1350"></canvas></div>
      <div class="actions">
        <button class="ghost" data-copy="1">Copy result</button>
        <button class="ghost" data-share="1">Share</button>
        <button data-download="1">Download card</button>
      </div>
    </div>`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);     ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/); const out = []; let ln = '';
  for (const w of words) { const t = ln ? ln+' '+w : w;
    if (ctx.measureText(t).width > maxW && ln) { out.push(ln); ln = w; } else ln = t; }
  if (ln) out.push(ln); return out;
}

// Draws the full 1080×1350 poster into a 2D context (used for both the on-page
// preview and the exported WebP). Reads currentName / currentTokens / currentEntered.
async function drawCard(ctx, templateKey) {
  const W = 1080, H = 1350, cx = W/2;
  const tpl = CARD_TEMPLATES[templateKey] || CARD_TEMPLATES.parchment;
  const n = currentName;
  const serif = 'Marcellus, Georgia, serif', body = 'Spectral, Georgia, serif';
  const img  = await loadImg(tpl.image);
  const logo = await loadImg(LOGO_SRC);

  ctx.clearRect(0, 0, W, H); ctx.textBaseline = 'alphabetic';
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const ink  = { title:'#2b2117', gold:'#9c6b2f', label:'#7a4a1e', soft:'#6b5d49', note:'#453a2c' };
  const lite = { title:'#f8f0dc', gold:'#f2cf96', label:'#e9d8b0', soft:'#e6d8b8', note:'#e9ddc2' };
  const C = img ? lite : ink;                       // full-bleed art → light text; parchment → ink
  const align = img ? (tpl.align || 'left') : 'left';
  const ta = align;                                 // text alignment
  const AX = align === 'right' ? W - 92 : 92;       // text anchor x (opposite the subject)

  /* ── background ─────────────────────────────────────────────────── */
  if (img) {
    // Full-page cover-crop: whole image height shown, framed horizontally by
    // alignX. Top + bottom scrims darken only the name/detail zones, leaving
    // the middle clear so the subject reads. No border (removed).
    const ir = img.width/img.height, rr = W/H; let dw, dh;
    if (ir > rr) { dh = H; dw = H*ir; } else { dw = W; dh = W/ir; }
    ctx.drawImage(img, (W-dw)*(tpl.alignX ?? 0.5), (H-dh)*0.5, dw, dh);
    let s = ctx.createLinearGradient(0,0,0,350);                       // top scrim (name)
    s.addColorStop(0,'rgba(8,6,3,.68)'); s.addColorStop(1,'rgba(8,6,3,0)');
    ctx.fillStyle=s; ctx.fillRect(0,0,W,350);
    s = ctx.createLinearGradient(0,530,0,H);                           // bottom scrim (details)
    s.addColorStop(0,'rgba(8,5,2,0)'); s.addColorStop(0.18,'rgba(8,5,2,.66)'); s.addColorStop(1,'rgba(4,2,1,.94)');
    ctx.fillStyle=s; ctx.fillRect(0,530,W,H-530);
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f7efdf'); g.addColorStop(1,'#e7d9bf');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for (let i=0;i<2400;i++){ ctx.fillStyle=`rgba(120,86,40,${Math.random()*0.05})`;
      ctx.fillRect(Math.random()*W, Math.random()*H, 1.6, 1.6); }
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.82);
    vg.addColorStop(0,'rgba(90,60,25,0)'); vg.addColorStop(1,'rgba(80,52,20,.16)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }

  const colW = W - 184;   // usable text width between the two 92px margins

  /* ── helpers ── */
  const shadow = on => { if (on) { ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=11; ctx.shadowOffsetY=2; }
                         else { ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; } };
  // aligned single line at the anchor
  const T = (txt, y, font, color) => { shadow(img); ctx.font=font; ctx.fillStyle=color; ctx.textAlign=ta; ctx.fillText(txt, AX, y); shadow(false); };
  // aligned tracked line (letter-spacing); fill may be a colour or a gradient; carve = engraved shadow
  const tracked = (txt, y, font, fill, sp, carve) => {
    ctx.font = font; const chars=[...txt];
    const tot = chars.reduce((w,ch)=>w+ctx.measureText(ch).width+sp,0)-sp;
    let px = ta==='right' ? AX-tot : AX; ctx.textAlign='left'; ctx.fillStyle=fill;
    if (img) { ctx.shadowColor=`rgba(0,0,0,${carve?0.8:0.55})`; ctx.shadowBlur=carve?9:11; ctx.shadowOffsetY=carve?3:2; }
    for (const ch of chars){ ctx.fillText(ch,px,y); px += ctx.measureText(ch).width+sp; }
    shadow(false); return tot;
  };
  const fitTracked = (txt, base, maxW, family, spf) => { let s=base;
    for (;;) { ctx.font=`${s}px ${family}`; const sp=spf*s;
      const tot=[...txt].reduce((w,ch)=>w+ctx.measureText(ch).width+sp,0)-sp;
      if (tot<=maxW || s<=28) return s; s-=3; } };
  const Ctr = (txt, y, font, color, sp=0) => { shadow(img); ctx.font=font; ctx.fillStyle=color; ctx.textAlign='center';
    if (sp) { const chars=[...txt]; const tot=chars.reduce((w,ch)=>w+ctx.measureText(ch).width+sp,0)-sp;
      let px=cx-tot/2; ctx.textAlign='left'; for (const ch of chars){ ctx.fillText(ch,px,y); px+=ctx.measureText(ch).width+sp; } }
    else ctx.fillText(txt,cx,y); shadow(false); };
  const label = (txt, y) => tracked(txt.toUpperCase(), y, `22px ${body}`, C.label, 3, false);
  // aligned flourish rule with an end lozenge
  const flourish = (y, w) => {
    const x1 = ta==='right' ? AX-w : AX;
    ctx.strokeStyle=C.gold; ctx.globalAlpha=.85; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1+w,y); ctx.stroke(); ctx.globalAlpha=1;
    const dx = ta==='right' ? x1-14 : x1+w+14;
    ctx.save(); ctx.translate(dx,y); ctx.rotate(Math.PI/4); ctx.fillStyle=C.gold; ctx.fillRect(-5,-5,10,10); ctx.restore();
  };
  const pill = (x, y, kind) => { shadow(false); ctx.font=`18px ${body}`;
    const t=kind.toUpperCase(), tw=ctx.measureText(t).width, pad=12, h=28, top=y-21, w=tw+pad*2;
    const cols={attested:img?'#8ecb91':'#5a8f5f',reviewed:C.label,approximate:img?'#e6ad6c':'#c07f38',reconstructed:'#c8a038'};
    const col=cols[kind]||C.soft; roundRect(ctx,x,top,w,h,14); ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle=col; ctx.textAlign='left'; ctx.fillText(t,x+pad,top+19); };

  /* ── name (cinematic: tracked, metallic gradient, glow) + subtexts ── */
  const title = (n ? n.canonical_name : currentEntered).toUpperCase();
  const titleY = img ? 168 : 176;
  const nsize = fitTracked(title, 104, img?840:colW, serif, 0.075);
  const ng = ctx.createLinearGradient(0, titleY-nsize*0.82, 0, titleY+nsize*0.14);
  if (img) { ng.addColorStop(0,'#fff8ea'); ng.addColorStop(.5,'#f4dcac'); ng.addColorStop(1,'#d7a54a'); }
  else     { ng.addColorStop(0,'#5c4726'); ng.addColorStop(1,'#2b2117'); }
  const nwidth = tracked(title, titleY, `${nsize}px ${serif}`, ng, nsize*0.075, false);
  flourish(titleY + 22, Math.min(nwidth*0.55, 240));

  // origin + meaning subtexts
  if (n) {
    T(`from ${n.origin_language}${n.historical_root ? '   ·   '+n.historical_root : ''}`, titleY+80, `italic 30px ${body}`, C.gold);
    T('“'+n.meaning_summary+'”', titleY+122, `italic 30px ${body}`, C.soft);
  } else {
    T('a phonetic approximation', titleY+80, `italic 30px ${body}`, C.soft);
  }

  /* ── detail block: low over the bottom scrim (images) / flowing (parchment) ── */
  let y = img ? 656 : titleY + 122 + 62;

  if (n) {
    y += 0; label('Old English equivalent', y); y += 46;
    const oe = (n.historical_forms||[]).find(f => f.language === 'Old English');
    const hasOe = oe && oe.historical_form;
    const val = hasOe ? oe.historical_form : 'none documented';
    const vfont = hasOe ? `34px ${serif}` : `italic 28px ${body}`;
    const kind = hasOe ? (oe.status||'attested') : 'reviewed';
    T(val, y, vfont, hasOe ? C.title : C.soft);
    ctx.font = vfont; const vw = ctx.measureText(val).width;
    ctx.font = `18px ${body}`; const pw = ctx.measureText(kind.toUpperCase()).width + 24;
    pill(ta==='right' ? AX - vw - 14 - pw : AX + vw + 14, y-2, kind);

    if (n.historical_notes) {
      y += 58; label('Origin', y);
      ctx.font = `24px ${body}`; const lines = wrapLines(ctx, n.historical_notes, colW).slice(0, img ? 2 : 3);
      y += 36; lines.forEach((ln,i) => T(ln, y+i*32, `24px ${body}`, C.note)); y += (lines.length-1)*32;
    }
  }

  /* ── inscriptions — the centrepiece: large, tracked, engraved gold ── */
  const glyphGrad = (yg, sz) => { const g = ctx.createLinearGradient(0, yg-sz*0.78, 0, yg+sz*0.12);
    if (img) { g.addColorStop(0,'#fbe6b4'); g.addColorStop(.55,'#eec775'); g.addColorStop(1,'#c48f3c'); }
    else     { g.addColorStop(0,'#9a6a24'); g.addColorStop(1,'#5f3d12'); } return g; };
  const inscription = (lbl, glyphs, family, yLabel) => {
    label(lbl, yLabel);
    const yg = yLabel + 84;
    const sz = fitTracked(glyphs, 92, colW-8, `"${family}", ${serif}`, 0.14);
    tracked(glyphs, yg, `${sz}px "${family}", ${serif}`, glyphGrad(yg, sz), sz*0.14, true);
    return yg;
  };
  const yf = transliterate(currentTokens, 'younger-futhark');
  const og = transliterate(currentTokens, 'ogham');
  y += 66;  inscription('Younger Futhark · approximate', yf, 'Noto Sans Runic', y);
  y += 152; inscription('Ogham · approximate',           og, 'Noto Sans Ogham', y);

  /* ── footer: logo + domain + disclaimer, centred ── */
  if (logo) { const lw=74, lh=74*logo.height/logo.width; ctx.drawImage(logo, cx-lw/2, 1196, lw, lh); }
  Ctr('✦   folklorefinder.uk   ✦', 1294, `30px ${serif}`, C.gold, 1);
  Ctr('an approximation of modern pronunciation, not an attested spelling', 1328, `italic 20px ${body}`, C.soft);
}

async function renderPreview() {
  const cv = document.getElementById('previewCanvas'); if (!cv) return;
  await document.fonts.ready.catch(()=>{});
  await drawCard(cv.getContext('2d'), currentTemplate);
}

async function renderShareCardBlob() {
  const scale = 2;   // supersample so text/vectors are razor-sharp and the photo resamples cleanly
  const c = document.createElement('canvas'); c.width = 1080*scale; c.height = 1350*scale;
  const ctx = c.getContext('2d'); ctx.scale(scale, scale);
  await drawCard(ctx, currentTemplate);
  return new Promise(res => c.toBlob(b => res(b), 'image/webp', 0.95));
}

function logSearch(query, matched) {
  const payload = {
    query_raw: query.slice(0, 200),
    matched: !!matched,
    matched_slug: matched ? matched.slug : null,
    session_id: sessionId(),
  };
  // Prototype: log to console so the "expansion queue" behaviour is visible.
  console.info('[name-search]', payload);
  // Real build:
  // fetch(FN_URL + '/submit-name-search', { method:'POST',
  //   headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
}
function sessionId() {
  let id = sessionStorage.getItem('ntt_sid');
  if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem('ntt_sid', id); }
  return id;
}

/* ============================================================
   8. FONT SUPPORT HINT
   ============================================================ */
function checkFontSupport() {
  // Heuristic: measure a runic glyph vs a fallback box. If the browser has no
  // covering font, widths collapse to the .notdef box — surface the hint.
  try {
    const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
    ctx.font = '48px "Noto Sans Runic", monospace';
    const w1 = ctx.measureText('ᚴ').width;
    ctx.font = '48px monospace';
    const w2 = ctx.measureText('￿').width; // guaranteed-missing glyph
    document.body.classList.toggle('needs-font', Math.abs(w1 - w2) < 0.5);
  } catch {}
}

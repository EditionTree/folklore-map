<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Updates &amp; What's New &#183; Folklore Map of the British Isles</title>
<meta name="description" content="What's new on the Folklore Map of the British Isles — recent site updates and the latest legends added to the map."/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="https://fmotbi.pages.dev/updates.html"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://fmotbi.pages.dev/updates.html"/>
<meta property="og:title" content="Updates &amp; What's New"/>
<meta property="og:description" content="Recent site updates and the latest legends added to the Folklore Map of the British Isles."/>
<meta property="og:image" content="https://fmotbi.pages.dev/og/preview.png"/>
<meta property="og:site_name" content="Folklore Map of the British Isles"/>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --parchment:#f2e8d5;
  --parchment-dk:#e0d0b0;
  --ink:#2c1f0e;
  --ink-light:#5c4a2a;
  --accent:#8b3a1a;
  --accent-warm:#c4622a;
  --gold:#b09060;
  --dark:#1a0e06;
}

body{background:var(--parchment-dk);color:var(--ink);font-family:'Crimson Text',serif;line-height:1.7}

/* ── TOP NAV ── */
.topnav{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--dark);padding:12px 16px;border-bottom:1px solid rgba(176,144,96,0.2);flex-wrap:wrap}
.topnav a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,232,213,0.78);text-decoration:none;padding:6px 14px;border-radius:3px;transition:background .15s,color .15s}
.topnav a:hover{color:#f2e8d5;background:rgba(196,98,42,0.18)}
.topnav a.active{color:var(--accent-warm)}

/* ── PAGE HEAD ── */
.page-head{position:relative;background:linear-gradient(135deg,rgba(196,98,42,0.18) 0%,rgba(176,144,96,0.06) 35%,transparent 60%),linear-gradient(180deg,#1a0e06 0%,#2c1510 55%,#3d1e0c 100%);padding:54px 20px 56px;text-align:center;overflow:hidden}
.page-head::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--accent-warm) 50%,var(--gold) 80%,transparent)}
.page-head img{width:96px;height:96px;object-fit:contain;margin-bottom:18px;filter:drop-shadow(0 4px 18px rgba(196,98,42,0.45))}
.page-head h1{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,36px);font-weight:600;color:#f2e8d5;letter-spacing:.06em;line-height:1.2;margin-bottom:8px}
.page-head p{font-style:italic;color:rgba(176,144,96,0.85);font-size:clamp(14px,2.5vw,17px)}

/* ── BODY ── */
.wrap{max-width:760px;margin:0 auto;padding:0 20px 70px}
.section{padding:48px 0 0}
.section-rule{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-rule::before,.section-rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.section-rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
.section-rule span{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}

/* ── RELEASES ── */
.release{background:var(--parchment);border:1px solid var(--gold);border-radius:6px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.release::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-warm) 40%,var(--gold) 60%,transparent)}
.release-date{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.release ul{margin:0;padding-left:20px}
.release li{margin-bottom:7px;font-size:16px}

/* ── FOOTER ── */
footer{text-align:center;padding:28px 20px;font-size:12px;color:var(--ink-light);border-top:1px solid rgba(176,144,96,0.2)}
footer a{color:var(--ink-light)}
</style>
</head>
<body>

<nav class="topnav">
  <a href="./">Home</a>
  <a href="map.html">Map</a>
  <a href="legends/">Browse</a>
  <a href="about.html">About</a>
  <a href="updates.html" class="active">Updates</a>
</nav>

<header class="page-head">
  <img src="green-man.png" alt="Green Man emblem"/>
  <h1>Updates &amp; What's New</h1>
  <p>How the map is growing and changing over time</p>
</header>

<div class="wrap">

  <section class="section">
    <div class="section-rule"><span>Site Updates</span></div>
    <div id="siteUpdates"></div>
  </section>

</div>

<footer>Part of the Folklore Map of the British Isles &nbsp;&#183;&nbsp; &copy; EditionTree &nbsp;&#183;&nbsp; <a href="./">Home</a> &nbsp;&#183;&nbsp; <a href="privacy.html">Privacy</a></footer>

<script>
(function(){
  // ── Curated site updates (newest first). Append new release blocks at the top. ──
  const UPDATES = [
    { date: "June 2026", items: [
      "New welcome page with a weekly featured legend, recently-added entries and instant search.",
      "Related Legends added to the foot of every entry page, linking kindred tales nearby and alike.",
      "Browse the whole collection by category or by region.",
      "A dusk (night) mode for the map, easier on the eyes after dark.",
      "Moved to faster, more secure hosting."
    ] }
  ];

  const su = document.getElementById('siteUpdates');
  UPDATES.forEach(function(rel){
    var box = document.createElement('div'); box.className = 'release';
    var d = document.createElement('div'); d.className = 'release-date'; d.textContent = rel.date;
    box.appendChild(d);
    var ul = document.createElement('ul');
    rel.items.forEach(function(it){ var li = document.createElement('li'); li.textContent = it; ul.appendChild(li); });
    box.appendChild(ul);
    su.appendChild(box);
  });
})();
</script>
</body>
</html>
